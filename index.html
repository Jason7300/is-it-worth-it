<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Is It Worth It?</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 90%;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #667085;
            line-height: 1.6;
        }

        input {
            width: 80%;
            padding: 14px;
            margin-top: 20px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            font-size: 17px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Is It Worth It?</h1>

        <p>
            What are you thinking about buying?
        </p>

        <input
            type="text"
            id="product"
            placeholder="e.g. iPhone 17, laptop, motorcycle..."
        >

        <br>

        <button class="button" onclick="startTest()">
            Start the test
        </button>

    </div>

    <script>

        function startTest() {

            const product = document.getElementById("product").value;

            if (product.trim() === "") {
                alert("Please enter a product first.");
                return;
            }

            localStorage.setItem("product", product);

            window.location.href = "results.html";
        }

    </script>

</body>

</html>
