<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Result - Is It Worth It?</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 90%;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .product {
            font-size: 28px;
            font-weight: bold;
            color: #4f46e5;
            margin: 25px 0;
        }

        p {
            font-size: 20px;
            color: #667085;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        a:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Your Result</h1>

        <p>
            You are checking:
        </p>

        <div class="product" id="productName"></div>

        <p>
            Your personalized analysis will appear here.
        </p>

        <a href="index.html">
            ← Check another product
        </a>

    </div>

    <script>

        const product = localStorage.getItem("product");

        if (product) {
            document.getElementById("productName").textContent = product;
        } else {
            document.getElementById("productName").textContent = "No product selected";
        }

    </script>

</body>

</html>
